name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Test
        run: go test ./...

      - name: Build Windows amd64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags="-s -w" -o dist/NDLocGo.exe .
          Copy-Item README.md dist/README.md
          Copy-Item CHANGELOG.md dist/CHANGELOG.md
          Compress-Archive -Path dist/NDLocGo.exe,dist/README.md,dist/CHANGELOG.md -DestinationPath dist/NDLocGo-windows-amd64.zip -Force

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: NDLocGo ${{ github.ref_name }}
          body_path: RELEASE_NOTES_v0.1.0.md
          files: |
            dist/NDLocGo.exe
            dist/NDLocGo-windows-amd64.zip
